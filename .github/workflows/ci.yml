name: Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

jobs:
  eyepiece-bridge:
    # Android (bionic) binary: built with the NDK preinstalled on the
    # ubuntu-latest runner, outside the gcc container used for the mods.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build eyepiece_bridge
        run: |
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" \
            bash mods/eyepiece/bridge/build.sh out
          file out/eyepiece_bridge

      - name: Upload eyepiece_bridge
        uses: actions/upload-artifact@v4
        with:
          name: eyepiece-bridge
          path: out/eyepiece_bridge

  build:
    needs: eyepiece-bridge
    runs-on: ubuntu-latest
    container:
      image: gcc:13
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-compiler
        run: apt-get update -qq && apt-get install -y -qq gcc-aarch64-linux-gnu python3

      - name: Build loader
        run: cd src && make

      - name: Build mods
        run: |
          mkdir -p dist
          CC="aarch64-linux-gnu-gcc"
          CFLAGS="-shared -fPIC -O2 -fno-builtin -nostdlib"
          # Release builds ship only ready mods — skip untested/experimental/in-progress
          # ones and the dev template (README "Status" column is the source of truth).
          SKIP_MODS="audio mute input splash template"
          for dir in mods/*/; do
            dir=$(basename "$dir")
            [ ! -f "mods/$dir/mod.json" ] && continue
            if echo " $SKIP_MODS " | grep -q " $dir "; then
              echo "[skip] $dir (not release-ready)"; continue
            fi
            if grep -q '"so".*null' "mods/$dir/mod.json"; then
              echo "[skip] $dir (so=null)"; continue
            fi
            so=$(grep '"so"' "mods/$dir/mod.json" | head -1 | sed 's/.*"so"[^"]*"\([^"]*\)".*/\1/')
            [ -z "$so" ] && so="${dir}.so"
            srcfile=$(grep '"source"' "mods/$dir/mod.json" 2>/dev/null | head -1 | sed 's/.*"source"[^"]*"\([^"]*\)".*/\1/')
            [ -z "$srcfile" ] && srcfile="mod.c"
            if [ ! -f "mods/$dir/$srcfile" ]; then
              echo "[skip] $dir (no $srcfile)"; continue
            fi
            $CC $CFLAGS -I include -I mods -Wl,-soname,$so -o "dist/$so" "mods/$dir/$srcfile"
            echo "[natartos] $so ($(stat -c%s "dist/$so") bytes)"
          done

      - name: Check preloaded libraries for unresolved symbols
        # An unresolved symbol in a preloaded .so aborts every process it is
        # preloaded into (see scripts/build.sh).
        run: |
          bad=0
          for so in dist/*.so src/*.so; do
            [ -f "$so" ] || continue
            u=$(aarch64-linux-gnu-nm -D --undefined-only "$so" | awk '{print $2}' | grep -vxE 'dlsym' || true)
            if [ -n "$u" ]; then echo "::error::$so has undefined symbols: $u"; bad=1; fi
          done
          exit $bad

      - name: Build fb_receiver
        run: aarch64-linux-gnu-gcc -static -O2 -I include -o dist/fb_receiver mods/stream/fb_receiver.c -lm

      - name: Build doom_goggles
        run: |
          apt-get install -y -qq git make >/dev/null 2>&1
          git clone --depth 1 https://github.com/ozkl/doomgeneric.git /tmp/doomgeneric
          cp mods/doom/doomgeneric_goggles.c /tmp/doomgeneric/doomgeneric/
          cp mods/doom/Makefile.goggles /tmp/doomgeneric/doomgeneric/
          cd /tmp/doomgeneric/doomgeneric
          make -f Makefile.goggles
          cp doom_goggles $GITHUB_WORKSPACE/dist/
          chmod 755 $GITHUB_WORKSPACE/dist/doom_goggles

      - name: Build dm_noverity
        run: aarch64-linux-gnu-gcc -static -O2 -o dist/dm_noverity tools/dm_noverity.c

      - name: Download eyepiece_bridge
        uses: actions/download-artifact@v4
        with:
          name: eyepiece-bridge
          path: dist/

      - name: Collect dist
        run: |
          mkdir -p dist
          cp src/natartos_loader.so dist/
          cp deploy/inject.sh dist/
          chmod 644 dist/*.so
          chmod 755 dist/doom_goggles dist/fb_receiver dist/dm_noverity dist/eyepiece_bridge
          # icons (source assets); app binaries are built this run, not committed
          if [ -d assets/icons ]; then mkdir -p dist/icons && cp assets/icons/*.rgba dist/icons/ 2>/dev/null || true; fi
          mkdir -p dist/apps/stream dist/apps/doom dist/apps/eyepiece
          cp dist/fb_receiver dist/apps/stream/
          cp dist/doom_goggles dist/apps/doom/
          cp -p dist/eyepiece_bridge dist/apps/eyepiece/
          cd dist
          sha256sum *.so inject.sh dm_noverity fb_receiver doom_goggles eyepiece_bridge > SHA256SUMS

      - name: Generate manifest (schema 1)
        run: |
          cd dist
          VERSION="${GITHUB_REF_NAME:-dev}"
          python3 -c "
          import json, os, glob, hashlib

          version = '$VERSION'

          # loader
          with open('natartos_loader.so', 'rb') as f:
              loader_sha = hashlib.sha256(f.read()).hexdigest()

          # files
          files = []
          for name, path, mode in [('inject.sh', '/vendor/natartos/inject.sh', '0755')]:
              with open(name, 'rb') as f:
                  sha = hashlib.sha256(f.read()).hexdigest()
              files.append({'file': name, 'device_path': path, 'mode': mode, 'sha256': sha})
          # icons
          if os.path.isdir('icons'):
              for f in sorted(os.listdir('icons')):
                  if f.endswith('.rgba') and os.path.isfile(os.path.join('icons', f)):
                      with open(os.path.join('icons', f), 'rb') as fh:
                          sha = hashlib.sha256(fh.read()).hexdigest()
                      files.append({'file': f, 'device_path': '/vendor/natartos/icons/' + f, 'mode': '0644', 'sha256': sha})
          # apps
          if os.path.isdir('apps'):
              for root, dirs, fnames in os.walk('apps'):
                  for f in sorted(fnames):
                      rel = os.path.join(root, f)
                      mode = '0755' if os.access(rel, os.X_OK) else '0644'
                      with open(rel, 'rb') as fh:
                          sha = hashlib.sha256(fh.read()).hexdigest()
                      files.append({'file': os.path.basename(rel), 'device_path': '/vendor/natartos/' + rel, 'mode': mode, 'sha256': sha})

          # mods from mod.json
          provides_map = {'overlay': 'screen', 'background': 'background', 'splash': 'splash'}
          mods = []
          for mj in sorted(glob.glob('../mods/*/mod.json')):
              with open(mj) as f:
                  m = json.load(f)
              so = m.get('so')
              if so is None or not os.path.isfile(so):
                  continue
              with open(so, 'rb') as f:
                  sha = hashlib.sha256(f.read()).hexdigest()
              entry = {
                  'id': m['id'],
                  'name': m.get('name', m['id']),
                  'description': m.get('notes', ''),
                  'file': so,
                  'device_path': '/vendor/natartos/mods/' + so,
                  'mode': '0644',
                  'sha256': sha,
              }
              prov = provides_map.get(m['id'])
              if prov:
                  entry['provides'] = prov
              if m['id'] in ('overlay', 'popen', 'menu', 'doom', 'stream', 'background'):
                  entry['default'] = True
              mods.append(entry)

          manifest = {
              'schema': 1,
              'natartos_version': version,
              'device': 'E3T zv902',
              'loader': {
                  'file': 'natartos_loader.so',
                  'device_path': '/vendor/natartos/natartos_loader.so',
                  'mode': '0644',
                  'sha256': loader_sha,
              },
              'files': files,
              'mods': mods,
              'backup': [
                  '/vendor/etc/init/dji_glasses_custom.rc',
                  '/vendor/etc/selinux/precompiled_sepolicy',
              ],
              'remove': [
                  '/vendor/etc/init/persist_adb.rc',
                  '/vendor/lib64/natartos_loader.so',
                  '/vendor/lib64/hook_debug.so',
                  '/vendor/natartos/mods/hook_debug.so',
                  '/vendor/lib64/hook_bitmap.so',
              ],
          }
          with open('manifest.json', 'w') as f:
              json.dump(manifest, f, indent=2)
              f.write('\n')
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: natartos-dist
          path: dist/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: natartos-dist
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          # Flat asset names (GitHub asset names can't contain "/"), so the web
          # installer can match each manifest `file` basename exactly. Nested
          # dirs (icons, apps) are uploaded flat; apps binaries dup the top-level
          # fb_receiver/doom_goggles/eyepiece_bridge, so only the top-level
          # copies are uploaded.
          files: |
            dist/*.so
            dist/inject.sh
            dist/fb_receiver
            dist/doom_goggles
            dist/eyepiece_bridge
            dist/dm_noverity
            dist/manifest.json
            dist/SHA256SUMS
            dist/icons/*.rgba
          generate_release_notes: true
